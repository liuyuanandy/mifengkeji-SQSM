apply plugin: 'com.android.library'
android {
    compileSdkVersion 35
    namespace "com.yuci.okhttp"


    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar','*.aar'])

